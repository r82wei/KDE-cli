vmType: "{{VM_TYPE}}"

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

cpus: {{CPUS}}
memory: "{{MEMORY}}"
disk: "{{DISK}}"

mountType: "{{MOUNT_TYPE}}"

mounts:
  - location: "{{WORKSPACE_PATH}}"
    mountPoint: "/workspace"
    writable: true
  - location: "{{KDE_CLI_PATH}}"
    mountPoint: "/usr/local/lib/kde-cli-host"
    writable: false
  - location: "~"
    mountPoint: "{{HOME_PATH}}"
    writable: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux

      # Docker
      if ! command -v docker &>/dev/null; then
          curl -fsSL https://get.docker.com | sh
          usermod -aG docker "${LIMA_CIDATA_USER}"
      fi

      # kubectl
      if ! command -v kubectl &>/dev/null; then
          curl -fsSL https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/$(dpkg --print-architecture)/kubectl \
              -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
      fi

      # 基礎工具
      apt-get update -qq
      apt-get install -y -qq tmux git curl vim build-essential jq

  - mode: user
    script: |
      #!/bin/bash
      set -eux

      # 安裝 KDE-CLI（從 host 掛載的路徑 symlink）
      if [ -d /usr/local/lib/kde-cli-host/kde.sh ]; then
          sudo ln -sf /usr/local/lib/kde-cli-host/kde.sh /usr/local/bin/kde
      elif [ ! -f /usr/local/bin/kde ]; then
          if [ -d /usr/local/lib/kde-cli-host ]; then
              sudo mkdir -p /usr/local/lib/kde
              sudo cp -r /usr/local/lib/kde-cli-host/. /usr/local/lib/kde/
              sudo ln -sf /usr/local/lib/kde/kde.sh /usr/local/bin/kde
          fi
      fi

      # tmux-resurrect
      TMUX_PLUGIN_DIR="${HOME}/.tmux/plugins"
      if [ ! -d "${TMUX_PLUGIN_DIR}/tmux-resurrect" ]; then
          mkdir -p "${TMUX_PLUGIN_DIR}"
          git clone https://github.com/tmux-plugins/tmux-resurrect "${TMUX_PLUGIN_DIR}/tmux-resurrect"
      fi

      # tmux 配置
      cat > "${HOME}/.tmux.conf" << 'TMUX_CONF'
      set -g default-terminal "screen-256color"
      set -g mouse on
      set -g history-limit 50000
      set -g base-index 1
      setw -g pane-base-index 1

      # tmux-resurrect
      run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
      set -g @resurrect-capture-pane-contents 'on'
      set -g @resurrect-strategy-vim 'session'
      TMUX_CONF

portForwards:
  - guestPortRange: [1, 65535]
    hostIP: "0.0.0.0"

hostResolver:
  enabled: true
  hosts:
    host.docker.internal: host.lima.internal
